<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura de Datos - Vacaciones</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #38bdf8;
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #cbd5e1;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    h2 {
      text-align: center;
      color: #0369a1;
      margin-bottom: 20px;
      font-size: 2rem;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    }

    form#formulario {
      background: var(--card-bg);
      max-width: 650px;
      margin: 0 auto 30px auto;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.15);
      border-top: 5px solid var(--primary);
    }

    label {
      font-weight: 600;
      color: #334155;
      display: inline-block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.3s ease;
      background-color: #f8fafc;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    /* Estilos de botones */
    form#formulario button, #seccionTabla button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
      margin-right: 8px;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    form#formulario button:hover, #seccionTabla button:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    form#formulario button:active, #seccionTabla button:active {
      transform: translateY(0);
    }

    /* Botones específicos de tabla */
    #tabla button {
      padding: 6px 10px;
      margin: 2px;
      font-size: 0.85rem;
    }

    #estado {
      text-align: center;
      font-weight: bold;
      color: #0284c7;
      margin: 15px 0;
      font-size: 1.1rem;
    }

    #seccionTabla {
      background: var(--card-bg);
      max-width: 95%;
      margin: 30px auto;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.15);
      overflow-x: auto;
    }

    #buscador {
      width: 100%;
      max-width: 300px;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 700;
    }

    tr:nth-child(even) {
      background-color: #f8fafc;
    }
  </style>
</head>
<body>

  <h2>✈️ Captura de Datos - Experiencia de Viaje 🌴</h2>

  <form id="formulario">
    <input type="hidden" id="id">

    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" required><br>

    <label for="pais">¿Te gustaría viajar a otro país?</label><br>
    <input type="text" id="pais" required><br>

    <label for="temporada">¿Cuál es tu temporada del año favorita?</label><br>
    <select id="temporada" required>
      <option value="" disabled selected>Selecciona una estación...</option>
      <option value="Invierno">Invierno</option>
      <option value="Primavera">Primavera</option>
      <option value="Verano">Verano</option>
      <option value="Otoño">Otoño</option>
    </select><br>

    <label for="playa">¿Prefieres la playa antes que la montaña?</label><br>
    <input type="text" id="playa" required><br>

    <label for="avion">¿Te gustaría viajar en avión?</label><br>
    <input type="text" id="avion" required><br> 
    
    <label for="compania">¿Prefieres viajar con tus amigos en lugar de con tu familia?</label><br>
    <input type="text" id="compania" required><br>
    
    <label for="comida">¿Te gustaría probar comida típica de otros países?</label><br>
    <input type="text" id="comida" required><br>
    
    <label for="clima">¿Prefieres los destinos fríos antes que los calurosos?</label><br>
    <input type="text" id="clima" required><br>
    
    <label for="parque">¿Te gustaría visitar un parque de diversiones en otro país?</label><br>
    <input type="text" id="parque" required><br>
    
    <label for="duracion">¿Preferirías pasar dos semanas de vacaciones en lugar de una semana?</label><br>
    <input type="text" id="duracion" required><br>
    
    <label for="cultura">¿Te gustaría conocer otras culturas durante tus viajes?</label><br>
    <input type="text" id="cultura" required><br>
    
    <div style="text-align: center; margin-top: 20px;">
      <button type="button" id="btnRegistrar">Registrar</button>
      <button type="button" id="btnConsultar">Consultar</button>
      <button type="button" id="btnModificar">Modificar</button>
      <button type="button" id="btnEliminar">Eliminar</button>
    </div>
  </form>

  <p id="estado"></p>

  <div id="seccionTabla">
    <h2>Registros de Viajeros</h2>
    <button type="button" id="btnCerrar">Cerrar tabla</button>
    <br><br>
    <input type="text" id="buscador" placeholder="Buscar por nombre...">

    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Nombre</th>
          <th>País</th>
          <th>Temporada</th>
          <th>Playa</th> 
          <th>Avión</th>
          <th>Compañía</th>
          <th>Comida</th>
          <th>Clima</th>
          <th>Parque</th>
          <th>Duración</th>
          <th>Cultura</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>

  <script>
    var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzslbQbCEOr-nt1gFIs6wporEVEpV1crp3Hhg4dMf-vpGQ8NE-Wr4HEcvTLXLNFqbIlyQ/exec";
    var registros = [];
    var tablaVisible = false;

    function enviar(datos) {
      return fetch(URL_SCRIPT, {
        method: "POST",
        body: new URLSearchParams(datos)
      }).then(function (r) { return r.json(); });
    }

    function actualizarBotones() {
      var hayRegistro = document.getElementById("id").value !== "";
      document.getElementById("btnRegistrar").disabled = hayRegistro;
      document.getElementById("btnModificar").disabled = !hayRegistro;
      document.getElementById("btnEliminar").disabled = !hayRegistro;
    }

    function limpiarFormulario() {
      document.getElementById("formulario").reset();
      document.getElementById("id").value = "";
      actualizarBotones();
    }

    document.getElementById("btnRegistrar").onclick = function () {
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Guardando...";
      enviar({
        accion: "guardar",
        nombre: document.getElementById("nombre").value,
        pais: document.getElementById("pais").value,
        temporada: document.getElementById("temporada").value,
        playa: document.getElementById("playa").value, 
        avion: document.getElementById("avion").value,
        compania: document.getElementById("compania").value,
        comida: document.getElementById("comida").value,
        clima: document.getElementById("clima").value,
        parque: document.getElementById("parque").value,
        duracion: document.getElementById("duracion").value,
        cultura: document.getElementById("cultura").value,
      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro guardado!");
      });
    };

    document.getElementById("btnConsultar").onclick = function () {
      document.getElementById("estado").textContent = "Consultando...";
      tablaVisible = true;
      document.getElementById("seccionTabla").style.display = "block";
      cargarRegistros(function () {
        document.getElementById("estado").textContent = "";
      });
    };

    function cargarRegistros(alTerminar) {
      fetch(URL_SCRIPT)
        .then(function (r) { return r.json(); })
        .then(function (datos) {
          registros = datos;
          mostrarTabla();
          if (alTerminar) alTerminar();
        });
    }

    function mostrarTabla() {
      var filtro = document.getElementById("buscador").value.trim().toLowerCase();
      var tabla = document.getElementById("tabla");
      tabla.innerHTML = "";

      registros.forEach(function (reg) {
        if (!reg.nombre.toString().toLowerCase().startsWith(filtro)) return;

        var tr = document.createElement("tr");
        agregarCelda(tr, new Date(reg.fecha).toLocaleString());

        agregarCelda(tr, reg.nombre);
        agregarCelda(tr, reg.pais);
        agregarCelda(tr, reg.temporada);
        agregarCelda(tr, reg.playa);
        agregarCelda(tr, reg.avion);
        agregarCelda(tr, reg.compania);
        agregarCelda(tr, reg.comida);
        agregarCelda(tr, reg.clima);
        agregarCelda(tr, reg.parque);
        agregarCelda(tr, reg.duracion);
        agregarCelda(tr, reg.cultura);

        var td = document.createElement("td");

        var btnModificarFila = document.createElement("button");
        btnModificarFila.textContent = "Modificar";
        btnModificarFila.onclick = function () { cargarEnFormulario(reg); };

        var btnEliminarFila = document.createElement("button");
        btnEliminarFila.textContent = "Eliminar";
        btnEliminarFila.onclick = function () { eliminar(reg.id); };

        td.appendChild(btnModificarFila);
        td.appendChild(btnEliminarFila);
        tr.appendChild(td);
        tabla.appendChild(tr);
      });
    }

    function agregarCelda(fila, texto) {
      var td = document.createElement("td");
      td.textContent = texto;
      fila.appendChild(td);
    }

    document.getElementById("buscador").oninput = mostrarTabla;

    document.getElementById("btnCerrar").onclick = function () {
      tablaVisible = false;
      document.getElementById("seccionTabla").style.display = "none";
      document.getElementById("buscador").value = "";
      document.getElementById("tabla").innerHTML = "";
    };

    function cargarEnFormulario(reg) {
      document.getElementById("id").value = reg.id;

      document.getElementById("nombre").value = reg.nombre;
      document.getElementById("pais").value = reg.pais;
      document.getElementById("temporada").value = reg.temporada;
      document.getElementById("playa").value = reg.playa;
      document.getElementById("avion").value = reg.avion;
      document.getElementById("compania").value = reg.compania;
      document.getElementById("comida").value = reg.comida;
      document.getElementById("clima").value = reg.clima;
      document.getElementById("parque").value = reg.parque;
      document.getElementById("duracion").value = reg.duracion;
      document.getElementById("cultura").value = reg.cultura;

      document.getElementById("estado").textContent =
        "Modificando registro: cambia los datos y presiona Modificar";
      actualizarBotones();

      window.scrollTo(0, 0);
      document.getElementById("nombre").focus();
    }

    document.getElementById("btnModificar").onclick = function () {
      var id = document.getElementById("id").value;

      if (id === "") {
        alert("Primero elige un registro con el botón 'Modificar'");
        return;
      }
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Modificando...";
      enviar({
        accion: "editar",
        id: id,
        nombre: document.getElementById("nombre").value,
        pais: document.getElementById("pais").value,
        temporada: document.getElementById("temporada").value,
        playa: document.getElementById("playa").value,
        avion: document.getElementById("avion").value,
        compania: document.getElementById("compania").value,
        comida: document.getElementById("comida").value,
        clima: document.getElementById("clima").value,
        parque: document.getElementById("parque").value,
        duracion: document.getElementById("duracion").value,
        cultura: document.getElementById("cultura").value
      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro modificado!");
      });
    };

    document.getElementById("btnEliminar").onclick = function () {
      eliminar(document.getElementById("id").value);
    };

    function eliminar(id) {
      if (!confirm("¿Seguro que quieres eliminar este registro?")) return;

      document.getElementById("estado").textContent = "Eliminando...";
      enviar({ accion: "eliminar", id: id }).then(function (respuesta) {
        terminarAccion(respuesta, "Registro eliminado");
      });
    }

    function terminarAccion(respuesta, mensajeOk) {
      document.getElementById("estado").textContent =
        respuesta.ok ? mensajeOk : "Error: " + respuesta.mensaje;
      limpiarFormulario();
      if (tablaVisible) cargarRegistros();
    }

    actualizarBotones();
  </script>

</body>
</html>
